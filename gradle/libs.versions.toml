# 注意：TOML 的注释符是 #，不是 //
# 版本目录（Version Catalog）：所有依赖版本集中在此，AGP 版本必须与 Gradle 版本匹配

[versions]
agp = "8.7.3"            # compileSdk 35 需要 AGP 8.6+，配 Gradle 8.9
kotlin = "2.0.21"
ksp = "2.0.21-1.0.25"    # 前缀必须与 kotlin 版本一致，否则 KSP 无法加载
composeBom = "2024.12.01"
coreKtx = "1.15.0"
coreSplashscreen = "1.0.1"   # Android 12+ 启动开屏，向前兼容到 minSdk 21
lifecycle = "2.8.7"
activityCompose = "1.9.3"
navigation = "2.8.5"
okhttp = "4.12.0"
coroutines = "1.9.0"
coil = "2.7.0"
telephoto = "0.14.0"
commonsCompress = "1.27.1"
xz = "1.9"               # commons-compress 解压 7z 需要
# commons-compress 自 1.8 起已移除 RAR 支持（专有格式），RAR 解压只能靠 junrar（纯 Java，支持 RAR2/3/4）
junrar = "7.5.10"
room = "2.6.1"
datastore = "1.1.2"
securityCrypto = "1.1.0-alpha06"
window = "1.3.0"
sardine = "0.8"         # 注意：必须用 thegrizzlylabs（包名 com.thegrizzlylabs.sardineandroid），
                        # lookfirst 坐标在 jitpack 上已返回 401 不可用

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
# by viewModels() 委托在 activity-ktx 里，activity-compose 不一定传递依赖到它
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

okhttp-bom = { group = "com.squareup.okhttp3", name = "okhttp-bom", version.ref = "okhttp" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
telephoto-zoomable-image-coil = { group = "me.saket.telephoto", name = "zoomable-image-coil", version.ref = "telephoto" }

commons-compress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commonsCompress" }
tukaani-xz = { group = "org.tukaani", name = "xz", version.ref = "xz" }
junrar = { group = "com.github.junrar", name = "junrar", version.ref = "junrar" }

sardine-android = { group = "com.github.thegrizzlylabs", name = "sardine-android", version.ref = "sardine" }

room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
androidx-window = { group = "androidx.window", name = "window", version.ref = "window" }

[bundles]
compose = ["androidx-compose-ui", "androidx-compose-ui-graphics", "androidx-compose-material3"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
